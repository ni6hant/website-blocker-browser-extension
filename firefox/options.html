<!DOCTYPE html>
<html style="background-color: black;">

<head>
  <title>Manage Blocked Sites</title>
  <style>
    h2,
    ul,
    script,
    li,
    strong {
      color: white;
    }
  </style>
</head>

<body style="background-color: black;">

  <h2>Blocked Websites</h2>

  <!-- Input to add new site -->
  <input type="text" id="siteInput" placeholder="example.com">
  <button id="addBtn">Add</button>

  <br>
  <br>
  <strong>Remove Sites by Clicking the Button</strong>
  <p>
    Note: Adding www. before website blocks only the main domain for example, if I put www.youtube.com below, it only
    blocks Youtube but not studio.youtube.com .
  </p>

  <ul id="siteList"></ul>

  <script src="options.js"></script>

</body>

</html>
